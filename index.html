<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Betu ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff758c,#ff7eb3);
overflow:hidden;
color:white;
}

h1{
font-size:60px;
animation:zoom 2s infinite alternate;
text-align:center;
}

p{
font-size:24px;
margin-top:20px;
text-align:center;
}

button{
margin-top:40px;
padding:15px 40px;
font-size:22px;
border:none;
border-radius:50px;
background:white;
color:#ff2d55;
cursor:pointer;
}

button:hover{
transform:scale(1.08);
}

@keyframes zoom{
from{transform:scale(1);}
to{transform:scale(1.08);}
}
</style>

</head>

<body>

<div>
<h1>❤️ Happy Girlfriend Day ❤️</h1>
<p>For My Betu 💖</p>

<button onclick="alert('Welcome Betu ❤️')">
Enter Our Love Story
</button>

</div>

</body>
</html>
